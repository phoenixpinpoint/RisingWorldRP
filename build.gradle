import groovy.json.JsonSlurper

plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

if (providers.gradleProperty('alternateBuildDir').present) {
    layout.buildDirectory = file(providers.gradleProperty('alternateBuildDir').get())
}

group = 'com.example'
version = '0.8.1'

def configuredRisingWorldPath = providers.gradleProperty('risingWorldPath')
        .orElse(providers.environmentVariable('RISING_WORLD_PATH'))

def configFile = file('config/build.config.json')
if (!configuredRisingWorldPath.present && configFile.isFile()) {
    def configuredPath = new JsonSlurper().parse(configFile).risingWorldPath
    if (configuredPath instanceof String && !configuredPath.isBlank()) {
        configuredRisingWorldPath = providers.provider { configuredPath }
    }
}

def standardInstallPaths = [
        new File(System.getProperty('user.home'),
                'Library/Application Support/Steam/steamapps/common/RisingWorld'),
        new File(System.getProperty('user.home'),
                '.steam/steam/steamapps/common/RisingWorld')
]
def configuredDirectory = configuredRisingWorldPath.present
        ? file(configuredRisingWorldPath.get())
        : null
def risingWorldDirectory = configuredDirectory?.isDirectory()
        ? configuredDirectory
        : standardInstallPaths.find { it.isDirectory() }

if (configuredDirectory != null && !configuredDirectory.isDirectory()) {
    logger.warn("Configured Rising World directory does not exist: ${configuredDirectory}")
}

def findSdkJar = { File directory ->
    if (directory == null) return null
    def sdkDirectories = [
            new File(directory, 'Data/SDK'),
            new File(directory, 'RisingWorld.app/Contents/Resources/Data/SDK')
    ]
    for (def sdkDirectory : sdkDirectories) {
        def preferredJar = new File(sdkDirectory, 'PluginAPI.jar')
        if (preferredJar.isFile()) {
            return preferredJar
        }

        def jars = sdkDirectory.isDirectory()
                ? fileTree(sdkDirectory) { include '*.jar' }.files.sort()
                : []
        if (!jars.empty) return jars.first()
    }
    return null
}
def sdkJar = findSdkJar(risingWorldDirectory)

sourceSets {
    main {
        java.srcDirs = ['src']
        resources.srcDirs = ['.']
        resources.include 'resources/**'
    }
}

dependencies {
    if (sdkJar != null) {
        compileOnly files(sdkJar)
    }
    implementation 'org.xerial:sqlite-jdbc:3.53.1.0'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
}

java {
    sourceCompatibility = JavaVersion.VERSION_20
    targetCompatibility = JavaVersion.VERSION_20
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 20
    doFirst {
        if (sdkJar == null) {
            throw new GradleException('Rising World Plugin API not found. Set -PrisingWorldPath="/path/to/RisingWorld", set RISING_WORLD_PATH, or update config/build.config.json for this computer.')
        }
    }
}

tasks.named('jar') {
    archiveBaseName = 'CivicCore'
    archiveVersion = ''
    destinationDirectory = layout.buildDirectory
    manifest {
        attributes(
                'Implementation-Title': 'CivicCore',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Adam Guthrie'
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.register('installPlugin', Copy) {
    group = 'Rising World'
    description = 'Builds and installs the plugin into the configured Rising World installation.'
    from tasks.named('jar').flatMap { it.archiveFile }
    into { requireRisingWorldDirectory(risingWorldDirectory) }
}

tasks.register('installConfig', Copy) {
    group = 'Rising World'
    description = 'Explicitly copies project configuration templates into the plugin directory.'
    from layout.projectDirectory.dir('config')
    include '*.properties', '*.json'
    into { requireRisingWorldDirectory(risingWorldDirectory) }
}

tasks.register('printRisingWorldSdk') {
    group = 'Rising World'
    description = 'Prints the Rising World API JAR used for compilation.'
    doLast {
        if (sdkJar == null) {
            throw new GradleException('Rising World Plugin API not found; configure risingWorldPath for this computer.')
        }
        println sdkJar
    }
}

File requireRisingWorldDirectory(File directory) {
    return requireRisingWorldDirectory(directory, 'CivicCore')
}

File requireRisingWorldDirectory(File directory, String pluginName) {
    if (directory == null) {
        throw new GradleException('Rising World installation not found; configure risingWorldPath for this computer.')
    }
    return new File(directory, "Plugins/${pluginName}")
}
